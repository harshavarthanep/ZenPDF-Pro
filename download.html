<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Download ZenPDF Pro · by H24 Creationz</title>
<meta name="description" content="ZenPDF Pro — every PDF tool, private and on your device. Free for Windows, Mac, Linux and Android, or try it online. Built by H24 Creationz.">
<meta name="author" content="H24 Creationz">
<meta property="og:title" content="ZenPDF Pro">
<meta property="og:description" content="Every PDF tool, private and on your device. Free.">
<meta property="og:image" content="zenpdf-icon-512.png">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232997ff'/%3E%3Cstop offset='1' stop-color='%230058d0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='15' fill='url(%23g)'/%3E%3Cpath d='M22 13h14l11 11v25a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V17a4 4 0 0 1 4-4z' fill='%23fff'/%3E%3Cpath d='M36 13v9a2 2 0 0 0 2 2h9' fill='%23cfe2ff'/%3E%3Cpath d='M25.5 32h13l-13 12h13' stroke='%230a6cf0' stroke-width='3.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="zenpdf-apple-touch-icon.png">
<style>
/* ZenPDF Pro — download page · H24 Creationz */
:root {
  color-scheme: light dark;
  --bg: #f5f5f7; --card: #fff; --text: #1d1d1f; --t2: #6e6e73; --t3: #a1a1a6; --line: rgba(0,0,0,.09);
  --blue: #0a6ff0; --tint: rgba(10,111,240,.08); --green: #28b84f;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #000; --card: #1c1c1e; --text: #f5f5f7; --t2: #a1a1a6; --t3: #6e6e73; --line: rgba(255,255,255,.1); --blue: #2b8cff; --tint: rgba(43,140,255,.13); --green: #30d158; }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 var(--font); -webkit-font-smoothing: antialiased;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
a { color: var(--blue); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { width: min(720px, 100% - 40px); margin: 0 auto; padding: 64px 0 40px; }

/* hero */
.hero { text-align: center; animation: in .7s var(--ease) both; }
.logo { width: 88px; height: 88px; display: block; margin: 0 auto; filter: drop-shadow(0 12px 24px rgba(10,111,240,.28)); }
h1 { font-size: clamp(34px, 6vw, 46px); line-height: 1.08; letter-spacing: -.035em; font-weight: 700; margin: 22px 0 8px; }
h1 span { color: var(--blue); }
.lede { color: var(--t2); font-size: 18px; margin: 0 auto; max-width: 480px; line-height: 1.45; }
.cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
.meta { color: var(--t2); font-size: 13.5px; margin-top: 12px; min-height: 20px; }
@keyframes in { from { opacity: 0; transform: translateY(10px); } }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 22px; border-radius: 12px;
  font: 600 15.5px/1 var(--font); letter-spacing: -.01em; cursor: pointer; border: 0; transition: transform .2s var(--ease), background .2s, opacity .2s; -webkit-tap-highlight-color: transparent; }
.btn:hover { text-decoration: none; }
.btn:active { transform: scale(.97); }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn.primary { background: var(--blue); color: #fff; min-width: 220px; }
.btn.primary:hover { opacity: .92; }
.btn.secondary { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 .5px var(--line), 0 1px 2px rgba(0,0,0,.05); }
.btn.secondary:hover { background: var(--tint); }
.btn .spin, .btn .ok { display: none; }
.btn.loading { pointer-events: none; }
.btn.loading .ic { display: none; } .btn.loading .spin { display: block; }
.btn.done { background: var(--green); } .btn.done .ic { display: none; } .btn.done .ok { display: block; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: #fff; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ok path { stroke-dasharray: 24; stroke-dashoffset: 24; animation: draw .4s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
@media (max-width: 480px) { .cta .btn { width: 100%; } }

/* demo video (only shown once DEMO_VIDEO is set) */
.video { margin-top: 44px; border-radius: 16px; overflow: hidden; background: #000; aspect-ratio: 16 / 9; box-shadow: 0 1px 2px rgba(0,0,0,.05), 0 16px 40px rgba(0,0,0,.1); }
.video video, .video iframe { width: 100%; height: 100%; display: block; border: 0; }

/* sections */
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--t2); margin: 48px 0 10px 16px; }
.group { background: var(--card); border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.item { display: flex; align-items: center; gap: 14px; padding: 14px 16px; position: relative; }
.item + .item::before { content: ""; position: absolute; top: 0; left: 64px; right: 0; border-top: .5px solid var(--line); }
.item.me { background: var(--tint); }
.os { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; flex: none; }
.os svg { width: 18px; height: 18px; }
.item .t { flex: 1; min-width: 0; }
.item .t b { font-weight: 600; font-size: 16px; letter-spacing: -.01em; }
.item .t small { display: block; color: var(--t2); font-size: 13px; line-height: 1.35; }
.item .tag { font-size: 10.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--blue); margin-left: 6px; vertical-align: 1px; }
.dls { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.get { position: relative; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 13px; border-radius: 15px; background: var(--tint); color: var(--blue);
  font: 600 13.5px/1 var(--font); white-space: nowrap; transition: background .2s, color .2s, transform .2s var(--ease); }
.get:hover { text-decoration: none; background: rgba(10,111,240,.15); }
.get:active { transform: scale(.95); }
.get .spin { width: 12px; height: 12px; border-color: rgba(10,111,240,.25); border-top-color: var(--blue); display: none; }
.get .ok { width: 13px; height: 13px; display: none; }
.get.loading .spin { display: block; }
.get.done { background: var(--green); color: #fff; } .get.done .ok { display: block; }
@media (max-width: 560px) { .item { flex-wrap: wrap; } .dls { width: 100%; justify-content: flex-start; padding-left: 48px; } }

details { border-top: .5px solid var(--line); } details:first-child { border-top: 0; }
summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::after { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--t3); border-bottom: 2px solid var(--t3); transform: rotate(-45deg); transition: transform .25s var(--ease); margin-right: 4px; }
details[open] summary::after { transform: rotate(45deg); }
details ol { margin: 0; padding: 0 16px 14px 36px; color: var(--t2); font-size: 14.5px; }
details li + li { margin-top: 4px; }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--tint); padding: 1px 5px; border-radius: 5px; word-break: break-all; }

footer { text-align: center; color: var(--t3); font-size: 13px; margin-top: 52px; }
footer b { color: var(--t2); font-weight: 600; }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 140%); opacity: 0; z-index: 50;
  width: max-content; max-width: calc(100% - 32px); display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px; border-radius: 14px;
  background: rgba(30,30,32,.94); color: #fff; font-size: 14px; line-height: 1.4; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); transition: transform .45s var(--ease), opacity .3s; }
.toast.on { transform: translate(-50%, 0); opacity: 1; }
.toast i { flex: none; width: 18px; height: 18px; border-radius: 50%; background: var(--green); display: grid; place-items: center; margin-top: 1px; }
.toast i svg { width: 11px; height: 11px; }
.toast b { font-weight: 600; }
.toast small { display: block; color: rgba(255,255,255,.7); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="ZenPDF Pro"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2997ff"/><stop offset="1" stop-color="#0058d0"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#g)"/><path d="M22 13h14l11 11v25a4 4 0 0 1-4 4H22a4 4 0 0 1-4-4V17a4 4 0 0 1 4-4z" fill="#fff"/><path d="M36 13v9a2 2 0 0 0 2 2h9" fill="#cfe2ff"/><path d="M25.5 32h13l-13 12h13" stroke="#0a6cf0" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>ZenPDF <span>Pro</span></h1>
    <p class="lede">Every PDF tool — edit, sign, fill, merge, compress, convert. Private, offline and free.</p>
    <div class="cta" id="cta"></div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="video" id="video" hidden></div>

  <h2>Downloads</h2>
  <div class="group" id="list"></div>

  <h2>Installing</h2>
  <div class="group" id="help"></div>

  <footer>ZenPDF Pro · built by <b>H24 Creationz</b><br><span id="ver"></span></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><i><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><div id="toast-t"></div></div>

<script>
/* ---------------------------------------------------------------
   DEMO VIDEO — add your video between the quotes and commit.
   Works with: 'demo.mp4' (a file in this repo), a YouTube link,
   or a Vimeo link.  Leave it empty and the video area is hidden.
   --------------------------------------------------------------- */
var DEMO_VIDEO = '';

(function () {
  'use strict';
  var $ = function (s) { return document.querySelector(s); };
  var host = location.hostname, seg = location.pathname.split('/').filter(Boolean), gh = /\.github\.io$/.test(host);
  var owner = gh ? host.split('.')[0] : 'harshavarthanep';
  var repo = gh && seg.length && !/\.html?$/.test(seg[0]) ? seg[0] : 'ZenPDF-Pro';
  var base = 'https://github.com/' + owner + '/' + repo + '/releases/latest/download/';
  var ua = navigator.userAgent, plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || '';
  var os = /android/i.test(ua) ? 'android' : (/iphone|ipad|ipod/i.test(ua) || (/mac/i.test(plat) && navigator.maxTouchPoints > 1)) ? 'ios'
         : /win/i.test(plat) || /windows/i.test(ua) ? 'win' : /mac/i.test(plat) ? 'mac' : /linux|x11|cros/i.test(plat + ' ' + ua) ? 'linux' : '';

  var DOWN = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19h14"/></svg>';
  var OK = '<svg class="ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var GLOBE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>';
  var ICON = {
    win: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 5.5 10.5 4.4v7.1H3zM11.5 4.3 21 3v8.5h-9.5zM3 12.5h7.5v7.1L3 18.5zM11.5 12.5H21V21l-9.5-1.3z"/></svg>',
    mac: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    linux: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17l6-5-6-5M12 19h8"/></svg>',
    android: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>',
    ios: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="2.5" width="11" height="19" rx="3"/><path d="M10.5 5h3"/></svg>'
  };
  /* minimum versions only — newer versions are always supported */
  var P = [
    { id: 'win', name: 'Windows', c: '#0a6ff0', req: 'Windows 10 or later · 64-bit, Intel and AMD',
      files: [['ZenPDF-Pro-Setup-x64.exe', 'Installer'], ['ZenPDF-Pro-Portable.exe', 'Portable'], ['ZenPDF-Pro-Setup-arm64.exe', 'ARM']],
      steps: ['Open <b>ZenPDF-Pro-Setup-x64.exe</b>.', 'If “Windows protected your PC” appears, choose <b>More info → Run anyway</b>.'] },
    { id: 'mac', name: 'Mac', c: '#6e6e73', req: 'macOS 11 or later · Intel and Apple silicon',
      files: [['ZenPDF-Pro-Mac.dmg', 'Download']],
      steps: ['Open the .dmg and drag ZenPDF Pro to <b>Applications</b>.', 'If macOS blocks it, go to <b>System Settings → Privacy &amp; Security → Open Anyway</b>.'] },
    { id: 'linux', name: 'Linux', c: '#f08a00', req: '64-bit · Ubuntu 18.04, Debian 10, Fedora 32 or later',
      files: [['ZenPDF-Pro-Linux.deb', '.deb'], ['ZenPDF-Pro-Linux.AppImage', 'AppImage']],
      steps: ['<b>.deb:</b> <code>sudo apt install ./ZenPDF-Pro-Linux.deb</code>', '<b>AppImage:</b> allow it to run as a program, then double-click.'] },
    { id: 'android', name: 'Android', c: '#28b84f', req: 'Android 6.0 or later',
      files: [['ZenPDF-Pro-Android.apk', 'APK']],
      steps: ['Open the downloaded <b>.apk</b>.', 'If asked, allow your browser to <b>install unknown apps</b>, then tap <b>Install</b>.'] },
    { id: 'ios', name: 'iPhone & iPad', c: '#5e5ce6', req: 'iOS and iPadOS 15 or later · in Safari', web: true,
      steps: ['Open ZenPDF Pro in <b>Safari</b>.', 'Tap <b>Share → Add to Home Screen</b>. It works offline after the first visit.'] }
  ];
  var byId = {}; P.forEach(function (p) { byId[p.id] = p; });
  var mine = byId[os];

  /* hero */
  var cta = $('#cta');
  if (mine && !mine.web) {
    var f = mine.files[0][0];
    cta.innerHTML = '<a class="btn primary" href="' + base + f + '" data-file="' + f + '" data-os="' + os + '">' + DOWN + '<span class="spin"></span>' + OK + '<span class="lb">Download for ' + mine.name + '</span></a>'
      + '<a class="btn secondary" href="./">' + GLOBE + 'Try online</a>';
    $('#meta').innerHTML = 'Free · <span class="v">latest version</span> · ' + mine.req.split(' · ')[0];
  } else {
    cta.innerHTML = '<a class="btn primary" href="./">' + GLOBE + (os === 'ios' ? 'Open ZenPDF Pro' : 'Try online') + '</a>';
    $('#meta').innerHTML = os === 'ios' ? 'Then tap Share → Add to Home Screen' : 'Free · works in any modern browser';
  }

  /* list */
  var order = mine ? [mine].concat(P.filter(function (p) { return p !== mine; })) : P;
  $('#list').innerHTML = order.map(function (p) {
    var right = p.web ? '<a class="get" href="./">Open</a>'
      : p.files.map(function (x) { return '<a class="get" href="' + base + x[0] + '" data-file="' + x[0] + '" data-os="' + p.id + '"><span class="spin"></span>' + OK + x[1] + '</a>'; }).join('');
    return '<div class="item' + (p === mine ? ' me' : '') + '"><span class="os" style="background:' + p.c + '">' + ICON[p.id] + '</span><div class="t"><b>' + p.name + '</b>'
      + (p === mine ? '<span class="tag">This device</span>' : '') + '<small>' + p.req + '</small></div><div class="dls">' + right + '</div></div>';
  }).join('');
  $('#help').innerHTML = order.map(function (p) {
    return '<details' + (p === mine ? ' open' : '') + '><summary>' + p.name + '</summary><ol>' + p.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol></details>';
  }).join('');

  /* download feedback */
  var toast = $('#toast'), tt;
  function say(html) { $('#toast-t').innerHTML = html; toast.classList.add('on'); clearTimeout(tt); tt = setTimeout(function () { toast.classList.remove('on'); }, 6000); }
  var published = null;
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[data-file]');
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || a.classList.contains('loading')) return;
    e.preventDefault();
    var p = byId[a.getAttribute('data-os')];
    a.classList.remove('done'); a.classList.add('loading');
    setTimeout(function () {
      a.classList.remove('loading');
      if (published === false) { say('<b>The apps are being published</b><small>Use ZenPDF Pro online in the meantime.</small>'); return; }
      location.href = a.href;
      a.classList.add('done');
      say('<b>Download started</b><small>' + p.steps[0].replace(/<[^>]+>/g, '') + '</small>');
      setTimeout(function () { a.classList.remove('done'); }, 4000);
    }, 700);
  });

  /* version from the latest release */
  fetch('https://api.github.com/repos/' + owner + '/' + repo + '/releases/latest')
    .then(function (r) { if (r.status === 404) published = false; return r.ok ? r.json() : null; })
    .then(function (j) {
      if (!j || !j.tag_name) return;
      published = true;
      var v = j.tag_name.replace(/^v/, '');
      [].forEach.call(document.querySelectorAll('.v'), function (e) { e.textContent = 'version ' + v; });
      $('#ver').textContent = 'Version ' + v;
    }).catch(function () {});

  /* demo video */
  var v = (DEMO_VIDEO || '').trim(), box = $('#video');
  var yt = /(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{6,})/.exec(v), vm = /vimeo\.com\/(?:video\/)?(\d+)/.exec(v);
  if (yt) box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + yt[1] + '?rel=0" title="ZenPDF Pro demo" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe>';
  else if (vm) box.innerHTML = '<iframe src="https://player.vimeo.com/video/' + vm[1] + '?dnt=1" title="ZenPDF Pro demo" allow="fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe>';
  else if (v) box.innerHTML = '<video src="' + v + '" controls playsinline preload="metadata"></video>';
  if (v) box.hidden = false;
})();
</script>
</body>
</html>
